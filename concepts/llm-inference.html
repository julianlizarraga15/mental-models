<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Inference — Mental Models</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/concepts/llm-inference.css">
</head>
<body>
  <main class="page">
    <a class="back" href="../index.html">← Home</a>
    <div class="eyebrow">Large language models</div>
    <h1>LLM Inference</h1>
    <p class="subtitle">disk → memory → GPU → tokens</p>
<section class="inference-visual" aria-label="LLM inference flow">
  <div class="flow-block">
    <div class="phase-label">LOAD ONCE</div>
    <div class="flow-line load-flow">
      <div class="unit">
        <strong>SSD</strong>
        <small>weights</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>RAM</strong>
        <small>CPU memory</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit accent-unit">
        <strong>VRAM</strong>
        <small>weights stay</small>
      </div>
    </div>
  </div>

  <div class="flow-block">
    <div class="phase-label">EACH REQUEST</div>
    <div class="flow-line request-flow">
      <div class="unit">
        <strong>Prompt</strong>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>CPU</strong>
        <small>tokenize</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="compute-unit">
        <div>
          <strong>GPU</strong>
          <small>math</small>
        </div>
        <div class="memory-chip">
          <strong>VRAM</strong>
          <small>weights + KV</small>
        </div>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>Token</strong>
        <small>repeat ↻</small>
      </div>
    </div>
  </div>
</section>
  </main>
</body>
</html>
