<section class="inference-visual" aria-label="LLM inference flow">
  <div class="flow-block">
    <div class="phase-label">LOAD ONCE</div>
    <div class="load-flow">
      <div class="unit">
        <strong>SSD</strong>
        <small>weights</small>
        <small>config + tokenizer</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="stage-stack">
        <div class="unit">
          <strong>CPU</strong>
          <small>read files</small>
        </div>
        <div class="unit">
          <strong>RAM</strong>
          <small>stage weights</small>
        </div>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="stage-stack">
        <div class="unit">
          <strong>GPU</strong>
          <small>model ready</small>
        </div>
        <div class="unit accent-unit">
          <strong>VRAM</strong>
          <small>weights copied</small>
          <small>weights stay loaded</small>
        </div>
      </div>
    </div>
  </div>

  <div class="flow-block">
    <div class="phase-label">EACH REQUEST</div>
    <div class="flow-line">
      <div class="unit">
        <strong>CPU + RAM</strong>
        <small>prompt in RAM</small>
        <small>tokenize → IDs</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit accent-unit gpu-step">
        <strong>GPU + VRAM</strong>
        <div class="mini-flow">
          <span>prefill</span>
          <span>KV cache</span>
          <span>decode ↻</span>
        </div>
        <small>weights + KV in VRAM</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>CPU + RAM</strong>
        <small>token IDs return</small>
        <small>detokenize → text</small>
      </div>
    </div>
  </div>
</section>
