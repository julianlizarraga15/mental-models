<section class="inference-visual" aria-label="LLM inference flow">
  <div class="flow-block">
    <div class="phase-label">LOAD ONCE</div>
    <div class="flow-line load-flow">
      <div class="unit">
        <strong>SSD</strong>
        <small>weights</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>RAM</strong>
        <small>CPU memory</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit accent-unit">
        <strong>VRAM</strong>
        <small>weights stay</small>
      </div>
    </div>
  </div>

  <div class="flow-block">
    <div class="phase-label">EACH REQUEST</div>
    <div class="flow-line request-flow">
      <div class="unit">
        <strong>Prompt</strong>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>CPU</strong>
        <small>tokenize</small>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="compute-unit">
        <div>
          <strong>GPU</strong>
          <small>math</small>
        </div>
        <div class="memory-chip">
          <strong>VRAM</strong>
          <small>weights + KV</small>
        </div>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="unit">
        <strong>Token</strong>
        <small>repeat ↻</small>
      </div>
    </div>
  </div>
</section>
